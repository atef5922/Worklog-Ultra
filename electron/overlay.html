<!doctype html>
<html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'"><title>Task Monitor</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:transparent;font-family:Segoe UI,Arial,sans-serif;color:#eaf1ff;user-select:none}.card{overflow:hidden;border:1px solid #314767;border-radius:16px;background:#10233e;box-shadow:0 18px 48px #0008}.head{display:flex;justify-content:space-between;padding:10px 12px;font-size:13px;font-weight:700}.count{color:#8fb8ef}.shot{display:block;width:100%;height:220px;object-fit:cover;background:#071426}.meta{padding:9px 12px;font-size:12px;color:#b8c8df}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 12px 12px}button{height:36px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.edit{background:#dbeafe;color:#173b71}.discard{background:#ffe1e8;color:#a11235}.submit{background:#22c55e;color:#062b14}
</style></head><body><div id="root"></div><script src="overlay.js"></script></body></html>
